name: Refresh job listings

# Runs every day at 06:00 UTC (07:00 Tunis time), and on demand.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest jobs
        run: python3 fetch_jobs.py

      - name: Commit updated jobs.json
        run: |
          git config user.name  "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add jobs.json
          # only commit when something actually changed
          git diff --staged --quiet || git commit -m "chore: refresh jobs.json ($(date -u +%Y-%m-%d))"
          git push

      # Optional: publish the tracker as a GitHub Pages site so you can open it
      # from your phone. Requires Settings > Pages > Source = GitHub Actions.
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp live_mobile_job_tracker.html _site/index.html
          cp jobs.json _site/jobs.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
